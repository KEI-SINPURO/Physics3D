<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プレミアム高校物理2Dシミュレーター</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <h1>高校物理 2D Engine</h1>
        </div>
        <div id="menu-list">
            </div>
    </div>

    <div id="main-content">
        <div id="header-bar">
            <div id="unit-title">単元を選択してください</div>
        </div>
        
        <div id="sim-container">
            <canvas id="sim-canvas"></canvas>

            <div id="control-panel">
                <button id="playBtn">⏸ 一時停止</button>
                <button id="resetBtn">🔄 リセット</button>
                <div class="ctrl-group">
                    <span>速度:</span>
                    <input type="range" id="speedSlider" min="0.1" max="2.0" step="0.1" value="1.0">
                    <span id="speedVal">1.00x</span>
                </div>
                <div class="ctrl-group">
                    <span>ズーム:</span>
                    <input type="range" id="zoomSlider" min="0.5" max="3.0" step="0.1" value="1.0">
                    <span id="zoomVal">1.0x</span>
                </div>
            </div>

            <div id="info-panel">
                <div id="sim-desc">左メニューから単元を選択すると、ここにシミュレーションの概要が表示されます。</div>
                <div id="formula-cards-container">
                    </div>
            </div>
        </div>
    </div>

    <script src="physicsData.js"></script>
    <script src="simulation.js"></script>
</body>
</html>
