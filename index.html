<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校物理 2Dシミュレーション＆公式完全マスター</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <header>
        <h1>高校物理 公式完全マスター</h1>
        <p>教科書の図解がそのまま動く！高精度2Dシミュレーション</p>
    </header>

    <div class="app-container">
        <nav class="sidebar">
            <div id="menu-list"></div>
        </nav>

        <main class="simulation-panel">
            <div id="canvas-container">
                <canvas id="sim-canvas"></canvas>
            </div>
            <div class="controls">
                <button id="playBtn">⏸ 一時停止</button>
                <button id="resetBtn">🔄 リセット</button>
            </div>
            <div id="sim-desc" class="sim-description">左から単元を選び、右の公式をクリックしてください。</div>
        </main>

        <aside class="info-panel">
            <h2 id="unit-title">単元を選択してください</h2>
            <p style="color:#e74c3c; font-weight:bold; margin-bottom:1rem;">👇 公式カードをクリックすると対応する図解が動きます</p>
            <div id="formula-cards-container"></div>
        </aside>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
