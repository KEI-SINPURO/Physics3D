<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校物理 3D公式完全マスター [全公式網羅版]</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <header>
        <h1>高校物理 3D公式完全マスター</h1>
        <p>全範囲・全公式 完全収録</p>
    </header>

    <div class="app-container">
        <nav class="sidebar">
            <ul id="menu-list"></ul>
        </nav>

        <main class="simulation-panel">
            <div id="canvas-container">
                <div class="camera-hint">👆ドラッグ:回転 / 🛞ホイール:拡大縮小</div>
            </div>
            <div class="controls">
                <button id="playBtn">⏸ 一時停止</button>
                <button id="resetBtn">🔄 リセット</button>
            </div>
            <div id="sim-desc" class="sim-description">左から単元を選び、右の公式をクリックしてください。</div>
        </main>

        <aside class="info-panel">
            <h2 id="unit-title">単元を選択してください</h2>
            <p style="color:#e74c3c; font-weight:bold; margin-bottom:1rem;">👇 公式カードをクリックすると対応する3Dが動きます</p>
            <div id="formula-cards-container"></div>
        </aside>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
