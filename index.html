<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理公式101選 ＆ 万能2D可視化シミュレーター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>⚛️ 物理マスター: 101公式完全連動シミュレーション</h1>
        <div class="tabs">
            <button id="tab-flashcard" class="tab-btn active" onclick="uiController.switchMode('flashcard')">📝 公式暗記モード</button>
            <button id="tab-sim" class="tab-btn" onclick="uiController.switchMode('sim')">🔬 万能2Dシミュレーション</button>
        </div>
    </header>

    <main>
        <aside class="sidebar">
            <ul id="menu-list"></ul>
        </aside>

        <section class="content">
            
            <div id="view-flashcard" class="view-section">
                <div class="stats-bar">
                    暗記完了: <span id="master-count" class="highlight">0</span> / 101
                </div>
                <div id="flashcard-container" class="grid-container"></div>
            </div>

            <div id="view-sim" class="view-section" style="display: none;">
                <div class="sim-header">
                    <h2 id="unit-title">左のメニューから、実験したい公式（No.1〜101）を選んでください</h2>
                    <div class="linked-formula">連動数式: <span id="current-sim-formula">-</span></div>
                    <div class="vector-legend">
                        <span class="legend-item"><span class="color-box vel-box"></span> 速度ベクトル ($\vec{v}$)</span>
                        <span class="legend-item"><span class="color-box force-box"></span> 力・加速度ベクトル ($\vec{F}$ / $\vec{a}$)</span>
                    </div>
                </div>

                <div class="sim-body">
                    <div class="canvas-wrapper">
                        <div id="canvas-placeholder">左メニューから公式を選択すると、対応する物理エンジンが自動起動します</div>
                        <canvas id="physics-canvas"></canvas>
                    </div>

                    <div id="panel-container" class="control-panel" style="visibility: hidden;">
                        <div class="panel-section">
                            <h3>⚙️ 公式から自動生成された変数</h3>
                            <div id="dynamic-controls"></div>
                        </div>

                        <div class="panel-section">
                            <h3>⏯️ 再生コントロール</h3>
                            <div class="control-actions">
                                <button id="btn-play-pause" onclick="physicsApp.togglePlayPause()">一時停止</button>
                                <button onclick="physicsApp.resetSimulation()">リセット</button>
                            </div>
                            <div class="control-item mt-2">
                                <span>再生速度: <span id="txt-speed">1.0x</span></span>
                                <input type="range" min="0.1" max="2.0" step="0.1" value="1.0" oninput="physicsApp.changeSpeed(this.value)">
                            </div>
                        </div>

                        <div class="panel-section explanation-box">
                            <h3>この公式の視覚的解説</h3>
                            <p id="explanation-text"></p>
                        </div>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <script src="formulas.js"></script>
    <script src="script.js"></script>
</body>
</html>
