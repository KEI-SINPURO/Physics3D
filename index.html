<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>高校物理 2Dシミュレーションエンジン</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            color: #2c3e50;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* サイドバー（メニュー） */
        #sidebar {
            width: 320px;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #34495e;
            overflow-y: auto;
        }
        .sidebar-title {
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #fff;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            text-align: center;
        }
        .chapter-group {
            margin-bottom: 20px;
        }
        .chapter-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: #bdc3c7;
            border-bottom: 1px solid #34495e;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .chapter-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .chapter-list .item {
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }
        .chapter-list .item:hover {
            background-color: #34495e;
            color: #fff;
        }
        .chapter-list .item.active {
            background-color: #3498db;
            color: #fff;
            font-weight: bold;
        }
        
        /* メインコンテンツエリア */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            padding: 20px;
            overflow: hidden;
        }
        #top-bar {
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        #unit-title {
            margin: 0;
            font-size: 1.6rem;
            color: #2c3e50;
            border-left: 5px solid #3498db;
            padding-left: 10px;
        }
        
        /* ワークスペース（左右分割） */
        #workspace {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0; /* スクロール崩れ防止 */
        }
        #left-pane {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }
        #canvas-container {
            flex: 1;
            background-color: #fff;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            position: relative;
        }
        #sim-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* コントロールパネル */
        #controls {
            background-color: #fff;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            flex-shrink: 0;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        .control-group label {
            font-weight: bold;
            color: #34495e;
        }
        button {
            padding: 8px 16px;
            font-size: 0.9rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        #playBtn {
            background-color: #2ecc71;
            color: white;
        }
        #playBtn:hover {
            background-color: #27ae60;
        }
        #resetBtn {
            background-color: #e74c3c;
            color: white;
        }
        #resetBtn:hover {
            background-color: #c0392b;
        }
        
        /* 右側ペイン（公式情報と解説） */
        #right-pane {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding-right: 5px;
            height: 100%;
        }
        #sim-desc-container {
            background-color: #fff;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        #sim-desc-container h4 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #2c3e50;
            border-left: 4px solid #e67e22;
            padding-left: 8px;
        }
        #sim-desc {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #57606f;
        }
        #formula-cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .formula-card {
            background-color: #fff;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }
        .formula-card:hover {
            border-color: #3498db;
            box-shadow: 0 6px 12px rgba(52,152,219,0.1);
        }
        .formula-card.active {
            border-color: #e74c3c;
            border-width: 2px;
            background-color: #fffdf9;
        }
        .formula-card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #c0392b;
        }
        .math-box {
            background-color: #f8f9fa;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: center;
            overflow-x: auto;
            border-left: 4px solid #bdc3c7;
        }
        .desc-section {
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .desc-section strong {
            color: #2c3e50;
            display: inline-block;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-title">物理シミュレーター</div>
        <div id="menu-list"></div>
    </div>
    
    <div id="main-content">
        <div id="top-bar">
            <h1 id="unit-title">単元タイトル</h1>
        </div>
        
        <div id="workspace">
            <div id="left-pane">
                <div id="canvas-container">
                    <canvas id="sim-canvas"></canvas>
                </div>
                <div id="controls">
                    <button id="playBtn">⏸ 一時停止</button>
                    <button id="resetBtn">🔄 リセット</button>
                    <div class="control-group">
                        <label for="speedSlider">速度:</label>
                        <input type="range" id="speedSlider" min="0.1" max="3.0" step="0.1" value="1.0">
                        <span id="speedVal">1.00x</span>
                    </div>
                    <div class="control-group">
                        <label for="zoomSlider">ズーム:</label>
                        <input type="range" id="zoomSlider" min="0.5" max="3.0" step="0.1" value="1.0">
                        <span id="zoomVal">1.0x</span>
                    </div>
                </div>
            </div>
            
            <div id="right-pane">
                <div id="sim-desc-container">
                    <h4>シミュレーション解説</h4>
                    <div id="sim-desc">公式カードを選択するとここにシミュレーションの説明が表示されます。</div>
                </div>
                <div id="formula-cards-container"></div>
            </div>
        </div>
    </div>

    <script>
// ==========================================
// 必須データ: physicsData の定義 (全分野完全網羅)
// ==========================================
const physicsData = {
    linear_motion: {
        chap: "第1章 力学",
        title: "等加速度直線運動",
        formulas: [
            {
                name: "等加速度直線運動の速度・変位",
                math: "\\[ v = v_0 + at, \\quad x = v_0t + \\frac{1}{2}at^2 \\]",
                usage: "一定の加速度で直線上を進む物体の、任意の時刻における速度や位置を求めたいとき。",
                reason: "初速度に「加速した分（at）」を加えると現在の速度になり、それを時間積分（または平均速度×時間）すると移動距離になります。",
                simText: "青いブロックが右向きに等加速度運動（または等速運動）する様子です。上のグラフはt-v図、またはt-x図の推移を示します。青矢印は速度、緑矢印は加速度です。",
                animType: "accel_linear"
            }
        ]
    },
    falling_bodies: {
        chap: "第1章 力学",
        title: "落体の運動",
        formulas: [
            {
                name: "斜方投射・自由落下",
                math: "\\[ y = v_0t + \\frac{1}{2}gt^2, \\quad v = v_0 + gt \\]",
                usage: "重力を受けて自由落下、または斜めに投げ上げられた物体の放物運動を解析するとき。",
                reason: "水平方向には力を受けないため等速（慣性運動）ですが、鉛直方向には下向きの一定な重力加速度 $g$ を受け続けるため、等加速度運動になります。",
                simText: "赤い球体を斜め上方に投げ上げたシミュレーションです。ドットの軌跡は放物線を描き、青矢印（速度ベクトル）と緑矢印（重力加速度 g）がリアルタイムに表示されます。",
                animType: "throw_angle"
            }
        ]
    },
    forces_spring: {
        chap: "第1章 力学",
        title: "力と摩擦・ばね",
        formulas: [
            {
                name: "フックの法則 (ばねの弾性力)",
                math: "\\[ F = -kx \\]",
                usage: "ばねが伸び縮みしたときに、物体を引き戻そうとする弾性力を求めるとき。",
                reason: "力 $F$ はばねの変位 $x$ に比例し、常に自然長（中心）に戻ろうとする逆の向き（マイナス符号）に働きます。",
                simText: "ばねに繋がれた紫のブロックの運動です。中心の自然長から離れるほど、逆向きに強い復元力 F (赤矢印) がかかるフックの法則を視覚化しています。",

            },
            {

                math: "\\[ f = \\mu N \\]",
                usage: "物体が接触面から受ける摩擦の大きさを計算するとき。",
                reason: "接触面を押し付ける力（垂直抗力 $N$）と、面の粗さ（摩擦係数 $\\mu$）の積によって摩擦の限界値や動摩擦力が決まります。",
                simText: "床の上のブロックを引っ張るシミュレーションです。引く力 F (青) と、それに対抗する床からの摩擦力 f (オレンジ) の関係を示しています。",
                animType: "force_friction_d"
            }
        ]
    },
    buoyancy: {
        chap: "第1章 力学",
        title: "圧力と浮力",
        formulas: [
            {
                name: "アルキメデスの原理 (浮力)",
                math: "\\[ F = \\rho V g \\]",
                usage: "水などの流体中に浮いている、または沈んでいる物体が受ける上向きの力を求めるとき。",
                reason: "物体が退けた流体の質量（密度 $\\rho \\times$ 体積 $V$）に働く重力と全く同じ大きさの反作用が、上向きの浮力として現れます。",
                simText: "流体中の物体が受ける力のつり合いです。物体にかかる下向きの重力 mg (赤) と、流体から受ける上向きの浮力 ρVg (緑) が表示されています。",
                animType: "buoyancy"
            }
        ]
    },
    moment: {
        chap: "第1章 力学",
        title: "剛体のつり合い",
        formulas: [
            {
                name: "力のモーメント",
                math: "\\[ M = F l \\]",
                usage: "物体を回転させる効果の大きさを評価したり、てんびんのつり合いを考えるとき。",
                reason: "回転の軸からの距離（腕の長さ $l$）が長いほど、またそこに垂直に加わる力 $F$ が大きいほど、物体を回転させる能力が高くなります。",
                simText: "支点の上に置かれた剛体棒（天秤）のモデルです。左右に配置されたおもりによる力のモーメントが相殺され、回転がつり合っている様子を表します。",
                animType: "moment_balance"
            },
            {
                name: "重心の公式",
                math: "\\[ x_G = \\frac{m_1x_1 + m_2x_2}{m_1 + m_2} \\]",
                usage: "複数の質量が集まった全体の質量中心（重心）の位置を求めるとき。",
                reason: "各点の位置を質量で重み付けした平均値であり、この点に全質量が集約されているかのように全体が運動します。",
                simText: "大小2つの質量（m₁, m₂）を繋いだ棒と、そのバランスポイントである重心位置 x_G (緑の点) の位置関係を可視化しています。",
                animType: "moment_center"
            }
        ]
    },
    momentum: {
        chap: "第1章 力学",
        title: "運動量と衝突",
        formulas: [
            {
                name: "運動量保存則",
                math: "\\[ m_1v_1 + m_2v_2 = m_1v_1' + m_2v_2' \\]",
                usage: "2つの物体が衝突、または破裂・合体するときの、衝突前後の速度変化を求めるとき。",
                reason: "衝突時に互いに及ぼし合う力は内力（作用・反作用）だけなので、系全体の運動量の総和は変化しません。",
                simText: "2つの球体が直線上を動いて衝突する様子です。衝突によって各速度は急変しますが、全体の運動量の和 (m₁v₁ + m₂v₂) は完全に一定に保たれます。",
                animType: "collision"
            }
        ]
    },
    energy: {
        chap: "第1章 力学",
        title: "エネルギー保存則",
        formulas: [
            {
                name: "力学的エネルギー保存則",
                math: "\\[ E = K + U = \\frac{1}{2}mv^2 + mgh = \\text{一定} \\]",
                usage: "摩擦や空気抵抗を無視できる状況で、物体の高さ変化と速度変化の関係を追いたいとき。",
                reason: "重力やばねの力などの「保存力」だけが仕事をする場合、運動エネルギー $K$ と位置エネルギー $U$ の間で形を変えるだけで、総量は変わりません。",
                simText: "単振り子の運動とエネルギーの推移です。右側のグラフで、運動エネルギー K (緑) と位置エネルギー U (オレンジ) が変化しても、総量 E (紫) が常に一定であることを示します。",
                animType: "energy"
            }
        ]
    },
    circular: {
        chap: "第1章 力学",
        title: "円運動",
        formulas: [
            {
                name: "向心力（遠心力）",
                math: "\\[ F = mr\\omega^2 = \\frac{mv^2}{r} \\]",
                usage: "物体が半径 $r$ の円軌道を等速で回り続けるために必要な、中心向きの力を計算するとき。",
                reason: "円運動は常に中心に向かって加速（向きの変化）しているため、運動方程式 $F=ma$ より、加速度 $r\\omega^2$ に応じた向心力が必要になります。",
                simText: "等速円運動のシミュレーションです。接線方向の速度 v (青矢印) と、常に中心を向く向心力 F (赤矢印、または回転系から見た外向きの遠心力) が描かれます。",
                animType: "circular"
            }
        ]
    },
    gravity: {
        chap: "第1章 力学",
        title: "万有引力",
        formulas: [
            {
                name: "万有引力の法則",
                math: "\\[ F = G \\frac{m_1m_2}{r^2} \\]",
                usage: "宇宙空間の惑星や、質量を持つ2物体間に働く引き合う力を計算するとき。",
                reason: "質量を持つ全ての物体は互いに引き合っており、その強さは互いの質量の積に比例し、距離 $r$ の2乗に反比例します。",
                simText: "中心にある太陽（橙）の周囲を、地球（青）が万有引力 F (赤矢印) を受けながら公転するケプラー運動の様子です。距離が離れると引力は急激に弱まります。",
                animType: "gravity"
            }
        ]
    },
    shm: {
        chap: "第1章 力学",

                usage: "等速円運動を横から見たような、往復運動（サイン運動）の挙動を調べるとき。",
                reason: "中心からのズレ $x$ に比例した逆向きの力（復元力）が働くとき、物体は周期的な正弦波の軌道を描いて振動します。",
                simText: "左側の円運動の上下の動きを取り出して、右側で時間軸に沿って展開したものです。時間が経つにつれて綺麗なサインカーブ（緑）が形成されます。",
                animType: "shm"
            }
        ]
    },
    thermo_heat: {
        chap: "第2章 熱力学",
        title: "熱量と状態変化",

                reason: "物質を温めるために必要な熱量は、その質量 $m$ と、物質固有の温まりにくさである比熱 $c$、および上昇させたい温度幅に比例します。",

                animType: "heat"
            }
        ]
    },
    thermo_gas: {
        chap: "第2章 熱力学",
        title: "理想気体の法則",
        formulas: [
            {
                name: "気体の状態方程式 / 第一法則",

                usage: "ピストン内の気体の圧力、体積、温度の関係、あるいは熱を出し入れしたときの内部エネルギー変化を追うとき。",

                simText: "ピストンで密閉された気体分子のシミュレーションです。ピストンを圧縮すると体積 V が減り、分子が壁にぶつかる頻度が増えて圧力 p や温度 T が上昇します。",
                animType: "gas"
            }
        ]
    },
    wave_base: {
        chap: "第3章 波動",
        title: "波の基本性質",

                animType: "wave"
            }
        ]
    },
    wave_doppler: {
        chap: "第3章 波動",
        title: "音波とドップラー効果",

            {
                name: "ドップラー効果",

                animType: "doppler"
            }
        ]

    wave_optics: {
        chap: "第3章 波動",
        title: "光の屈折とレンズ",
        formulas: [

                card.onclick = () => {

}

// Canvas 設定
const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d');
let animType = "";
let isPlaying = true;
let time = 0;
let scale = 1.0, panX = 0, panY = 0;
let isDragging = false, lastX = 0, lastY = 0;

function resizeCanvas() { 
    canvas.width = canvas.parentElement.clientWidth; 
    canvas.height = canvas.parentElement.clientHeight; 
}
window.addEventListener('resize', resizeCanvas); 
resizeCanvas();

// 初期ロード時のズレ防止のため遅延リサイズ
setTimeout(resizeCanvas, 50);

function setAnimation(type) { 
    animType = type; 
    time = 0; 
    scale = 1.0; 
    panX = 0; 
    panY = 0; 
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomVal = document.getElementById('zoomVal');
    if(zoomSlider && zoomVal) { zoomSlider.value = 1.0; zoomVal.innerText = "1.0x"; }
}

// コントロールUI
const speedSlider = document.getElementById('speedSlider');
if(speedSlider) speedSlider.addEventListener('input', e => document.getElementById('speedVal').innerText = parseFloat(e.target.value).toFixed(2) + "x");
const zoomSlider = document.getElementById('zoomSlider');
if(zoomSlider) zoomSlider.addEventListener('input', e => { scale = parseFloat(e.target.value); document.getElementById('zoomVal').innerText = scale.toFixed(1) + "x"; });
const playBtn = document.getElementById('playBtn');
if(playBtn) playBtn.onclick = () => { isPlaying = !isPlaying; playBtn.innerText = isPlaying ? "⏸ 一時停止" : "▶️ 再生"; };
const resetBtn = document.getElementById('resetBtn');
if(resetBtn) resetBtn.onclick = () => setAnimation(animType);

// マウス操作
canvas.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
canvas.addEventListener('mousemove', e => { if(isDragging) { panX += e.clientX - lastX; panY += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; } });
window.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('wheel', e => { 
    e.preventDefault(); 
    scale = Math.max(0.5, Math.min(3.0, scale + (e.deltaY > 0 ? -0.1 : 0.1))); 
    if(zoomSlider) zoomSlider.value = scale; 
    if(document.getElementById('zoomVal')) document.getElementById('zoomVal').innerText = scale.toFixed(1) + "x"; 
}, { passive: false });

// ====================================================
// 描画ユーティリティ
// ====================================================
function dLine(x1, y1, x2, y2, color, w=2, dash=[]) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
}

function dA(x1, y1, x2, y2, color, label="", dashed=false) { 
    dLine(x1, y1, x2, y2, color, 2, dashed ? [5,5] : []);
    if(x1 === x2 && y1 === y2) return;
    const a = Math.atan2(y2-y1, x2-x1);
    ctx.beginPath(); 
    ctx.moveTo(x2, y2); 
    ctx.lineTo(x2 - 12*Math.cos(a-0.4), y2 - 12*Math.sin(a-0.4)); 
    ctx.lineTo(x2 - 12*Math.cos(a+0.4), y2 - 12*Math.sin(a+0.4)); 
    ctx.fillStyle = color; ctx.fill();
    if(label) dMath(label, x2 + 15*Math.cos(a), y2 + 15*Math.sin(a), color);
}

function dC(x, y, r, color, fill=true) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
    if(fill){ ctx.fillStyle = color; ctx.fill(); } else { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); }
}

function dB(x, y, w, h, color) {
    ctx.fillStyle = color; ctx.fillRect(x-w/2, y-h/2, w, h); 
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2; ctx.strokeRect(x-w/2, y-h/2, w, h);
}

function dAng(x, y, r, a1, a2, label, color) {
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, a1, a2, false); ctx.closePath();
    ctx.fillStyle = color + "33"; ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
    let m = (a1+a2)/2; 
    dMath(label, x + (r+20)*Math.cos(m) - 5, y + (r+20)*Math.sin(m) + 5, color);
}

function dTxt(t, x, y, c="#2c3e50", f="16px 'Hiragino Sans', Arial, sans-serif") {
    ctx.font = f;
    ctx.fillStyle = c;
    ctx.shadowColor = "rgba(255, 255, 255, 0.9)";
    ctx.shadowBlur = 5;
    ctx.fillText(t, x, y);
    ctx.shadowBlur = 0; 
}

function dMath(t, x, y, c="#2c3e50", size=20) {
    ctx.font = `italic ${size}px 'Times New Roman', serif`;
    ctx.fillStyle = c;
    ctx.shadowColor = "rgba(255, 255, 255, 0.9)";
    ctx.shadowBlur = 5;
    ctx.fillText(t, x, y);
    ctx.shadowBlur = 0;
}

function dFormula(t, x, y) {
    ctx.font = "italic 18px 'Times New Roman', serif";
    const w = ctx.measureText(t).width + 30;
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.shadowColor = "rgba(0,0,0,0.15)";
    ctx.shadowBlur = 6;
    ctx.fillRect(x, y - 22, w, 32);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#bdc3c7";
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y - 22, w, 32);
    ctx.fillStyle = "#c0392b";
    ctx.fillText(t, x + 15, y);
}

function drawAxis(ox, oy, w, h, xL, yL) {
    dA(ox, oy+h, ox, oy-h, '#7f8c8d', yL); dA(ox-w, oy, ox+w, oy, '#7f8c8d', xL);
    dMath("O", ox-15, oy+15, '#7f8c8d');
}

// ====================================================
// メインループ
// ====================================================
function render() {
    requestAnimationFrame(render);
    try {
        let speed = (speedSlider) ? parseFloat(speedSlider.value) : 1.0;
        if(isPlaying) time += 0.04 * speed;
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.save();
        ctx.translate(w/2 + panX, h/2 + panY); 
        ctx.scale(scale, scale);

        // 背景グリッド
        ctx.strokeStyle = '#eef2f5'; ctx.lineWidth = 1;
        for(let i=-1000; i<=1000; i+=20) { 
            if(i%100===0) ctx.strokeStyle='#dfe6e9'; else ctx.strokeStyle='#eef2f5'; 
            dLine(i,-1000,i,1000,ctx.strokeStyle); dLine(-1000,i,1000,i,ctx.strokeStyle); 
        }
        dLine(-1000, 0, 1000, 0, '#b2bec3', 2); dLine(0, -1000, 0, 1000, '#b2bec3', 2); 

        let t = time % 6; 
        if(!animType) { dTxt("シミュレーションを選択してください。", -120, 0, "#7f8c8d"); ctx.restore(); return; }

        // ----------------------------------------------------
        // 1. 力学: 直線運動・加速度
        // ----------------------------------------------------
        if (animType === "work_cos") {
            dFormula("W = F x cosθ", -60, -120);
            ctx.fillStyle='#bdc3c7'; ctx.fillRect(-200, 40, 400, 5);
            let x = -100 + t*30; if(x > 150) time=0;
            dB(x, 20, 50, 40, '#3498db'); dMath("m", x-10, 25, "white");
            let F = 100, ang = -Math.PI/6; let Fx = F*Math.cos(ang), Fy = F*Math.sin(ang);
            dA(x, 0, x+Fx, Fy, '#7f8c8d', 'F'); dAng(x, 0, 40, ang, 0, "θ", "#e67e22");
            dA(x, 0, x+Fx, 0, '#e74c3c', 'F cosθ'); dLine(x+Fx, 0, x+Fx, Fy, '#bdc3c7', 2, [5,5]); 
            dA(-100, 60, x, 60, '#2ecc71', 'x');
        }
        else if (animType.includes("linear") || animType.includes("accel") || animType.includes("equation") || animType.includes("relative") || animType.includes("v_t")) {
            dFormula("v = v₀ + at,  x = v₀t + 1/2 at²", -120, -150);
            ctx.fillStyle='#bdc3c7'; ctx.fillRect(-300, 40, 600, 5); 
            let a = animType.includes("linear") || animType.includes("relative") ? 0 : 20;
            let v0 = 40; let x = -200 + v0*t + 0.5*a*t*t; let v = v0 + a*t;
            if(x > 250) time = 0;
            
            dB(x, 20, 50, 40, '#3498db'); dMath("m", x-8, 25, "white");
            if(!animType.includes("equation")) dA(x, -10, x + v, -10, '#2980b9', 'v');
            if(a > 0) dA(x, -35, x + a*3, -35, '#27ae60', 'a');
            
            if(animType.includes("relative")) {
                let x2 = -200 + 80*t; 
                dB(x2, -40, 50, 40, '#e74c3c'); dA(x2, -70, x2+80, -70, '#c0392b', 'v_A'); dMath("A", x2-10, -35, "white");
                dMath("B", x-10, 25, "white"); dTxt("v_AB = v_B - v_A", -60, -100);
            } else {
                drawAxis(-180, -100, 100, 80, "t", a>0?"v":"x");
                ctx.beginPath(); ctx.strokeStyle=a>0?'#2980b9':'#3498db'; ctx.lineWidth=2;
                for(let i=0; i<t; i+=0.1) ctx.lineTo(-180 + i*15, -100 - (a>0?(v0+a*i)*0.4 : v0*i*0.2));
                ctx.stroke();
            }
        }
        // ----------------------------------------------------
        // 2. 力学: 落体の運動 (投げ下ろし・投げ上げ)
        // ----------------------------------------------------
        else if (animType.includes("fall") || animType.includes("throw")) {
            dFormula("y = v₀t + 1/2 gt²,  v = v₀ + gt", -120, -160);
            let startY = animType.includes("throw") && !animType.includes("down") ? 100 : -100;
            let startX = animType.includes("angle") ? -150 : 0;
            let v0y = 0, v0x = 0, g = 50;
            if(animType.includes("fall_v0")) v0y = 50; 
            if(animType.includes("throw") && !animType.includes("down")) v0y = -130; 
            if(animType.includes("angle")) { v0x = 60; v0y = -130; startY = 100; }
            
            let cy = startY + v0y*t + 0.5*g*t*t; let cx = startX + v0x*t; let cvy = v0y + g*t;
            if(cy > 180 && t>0.5) time=0;

            dLine(-200, startY, 200, startY, '#7f8c8d', 1, [5,5]); dMath("y=0", -80, startY-10, '#7f8c8d');
            drawAxis(animType.includes("angle")?-150:-50, startY, animType.includes("angle")?200:30, 150, animType.includes("angle")?"x":"", "y");

            ctx.fillStyle='rgba(231,76,60,0.3)'; for(let i=0; i<t; i+=0.1) dC(startX+v0x*i, startY+v0y*i+0.5*g*i*i, 4);
            dC(cx, cy, 15, '#e74c3c'); dMath("m", cx-8, cy+6, "white");
            dA(cx+25, cy, cx+25, cy+cvy*0.4, '#2980b9', 'v'); dA(cx-25, cy, cx-25, cy+g*0.6, '#27ae60', 'g');
            if(v0y !== 0 && t < 0.8) dA(startX, startY, startX+v0x*0.4, startY+v0y*0.4, '#8e44ad', 'v₀');
        }
        // ----------------------------------------------------
        // 3. 力学: 力・摩擦・ばね
        // ----------------------------------------------------
        else if (animType.includes("force") || animType.includes("normal") || animType.includes("tension") || animType.includes("spring") || animType.includes("friction") || animType.includes("law")) {
            ctx.fillStyle='#7f8c8d'; ctx.fillRect(-150, 40, 300, 5);
            if(animType.includes("spring")) {
                dFormula("F = -kx", -40, -120);
                let sx = Math.sin(time*3)*60;
                ctx.fillRect(-120, -40, 10, 80); 
                ctx.beginPath(); ctx.moveTo(-110,10); let c = 10; let dx=(sx-30+110)/c; 
                for(let i=0;i<c;i++){ctx.lineTo(-110+dx*(i+0.5), 10+(i%2===0?-10:10));} 
                ctx.lineTo(sx-30,10); ctx.strokeStyle='#7f8c8d'; ctx.stroke();
                dB(sx, 10, 60, 60, '#9b59b6'); dMath("m", sx-10, 15, "white");
                dA(sx, 10, sx-sx, 10, '#e74c3c', 'F'); drawAxis(0, 60, 100, 10, "x", ""); 
            } else {
                if(animType.includes("friction")) dFormula("f = μN", -40, -120);
                else dFormula("W = mg", -40, -120);
                dB(0, 10, 60, 60, '#9b59b6'); dMath("m", -8, 15, "white");
                dA(0, 10, 0, 80, '#e74c3c', 'mg'); 
                if(animType.includes("tension")) { dA(0, -20, 0, -80, '#7f8c8d', '糸'); dA(0, 10, 0, -60, '#2ecc71', 'T'); }
                else dA(0, 10, 0, -60, '#2ecc71', 'N');
                
                if(animType.includes("friction")) {
                    let p = animType.includes("friction_s") ? (t*20) : 80; if(p>80) time=0;
                    dA(0, 10, p, 10, '#3498db', 'F'); dA(0, 40, -p, 40, '#e67e22', animType.includes("friction_s")?'f = μN':'f\' = μ\'N');
                    if(animType.includes("friction_d")) dA(0,-30,40,-30,'#2980b9','v');
                }
            }
        }
        // ----------------------------------------------------
        // 4. 力学: 圧力と浮力
        // ----------------------------------------------------
        else if (animType.includes("pressure") || animType.includes("buoyancy") || animType.includes("pascal")) {

                let phase = animType.includes("reactance") ? Math.PI/2 : (animType.includes("resonance")? 0 : Math.PI/4);
                dA(0, 0, 60*Math.cos(w - phase), 60*Math.sin(w - phase), '#3498db', 'I');
                dTxt("フェーザ図 (位相のズレ)", -90, -120);
            }
        }
        // ----------------------------------------------------
        // 17. 原子: 光電効果・ボーアモデル・核反応
        // ----------------------------------------------------
        else if (animType.includes("photo") || animType.includes("compton") || animType.includes("bohr") || animType.includes("atom") || animType.includes("decay") || animType.includes("mass") || animType.includes("matter") || animType.includes("work_func") || animType.includes("modern")) {
            if(animType.includes("photo") || animType.includes("work")) {
                dFormula("K_max = hν - W", -70, -150);
                dLine(-120, 50, 120, 50, "#7f8c8d", 20); dMath("Metal (仕事関数 W)", -70, 80);
                dA(-80, -50, -20, 40, "#f1c40f", "hν (光子)");
                if(t % 2 > 0.5) dA(0, 40, 80, -20, "#3498db", "e⁻ (K_max)");
            } else if(animType.includes("bohr") || animType.includes("atom")) {
                dFormula("mvr = n(h/2π),  hν = E_n - E_m", -120, -150);
                dC(0, 0, 15, "#e74c3c"); dMath("+Ze", -15, 30, "#e74c3c");
                dC(0, 0, 70, "#bdc3c7", false); dC(0, 0, 120, "#bdc3c7", false);
                let a = time*3;
                dC(70*Math.cos(a), 70*Math.sin(a), 8, "#3498db"); dMath("e⁻", 70*Math.cos(a)+15, 70*Math.sin(a)+15, "#3498db");
            } else {
                dFormula("E = Δm c² (質量欠損)", -80, -150);
                dC(0, 0, 40, "#e74c3c"); dMath("Mass Δm", -35, 60);
                dA(50, 0, 120, 0, "#f1c40f", "Energy E");
            }
        }
        // フォールバック
        else {
            dFormula("Simulation Running...", -80, -120);
            dTxt("設定されたアニメーション (" + animType + ") を実行中", -140, 0, "#7f8c8d");
        }
    } catch (e) {
        console.error("Render Error:", e);
        ctx.fillStyle = "red";
        ctx.fillText("エラーが発生しました: " + e.message, -150, 0);
    }
    ctx.restore();
}

// ループの開始
render();
    </script>
</body>
