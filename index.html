<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高校物理 2D超高精度シミュレーション</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <header>
        <h1>高校物理 公式完全マスター</h1>
        <p>ベクトルと三角関数が「見える」高精度2Dシミュレーション</p>
    </header>

    <div class="app-container">
        <nav class="sidebar">
            <div id="menu-list"></div>
        </nav>

        <main class="simulation-panel">
            <div id="canvas-container">
                <canvas id="sim-canvas"></canvas>
                <div class="canvas-ui">
                    <label>再生速度: <input type="range" id="speedSlider" min="0.25" max="1.0" step="0.05" value="1.0"><span id="speedVal">1.00x</span></label>
                    <label>ズーム: <input type="range" id="zoomSlider" min="0.5" max="3.0" step="0.1" value="1.0"><span id="zoomVal">1.0x</span></label>
                    <span class="hint">※ドラッグで画面移動</span>
                </div>
            </div>
            <div class="controls">
                <button id="playBtn">⏸ 一時停止</button>
                <button id="resetBtn">🔄 リセット / 視点戻す</button>
            </div>
            <div id="sim-desc" class="sim-description">左から単元を選び、右の公式をクリックしてください。</div>
        </main>

        <aside class="info-panel">
            <h2 id="unit-title">単元を選択してください</h2>
            <div id="formula-cards-container"></div>
        </aside>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
